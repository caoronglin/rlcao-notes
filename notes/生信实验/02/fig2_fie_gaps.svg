<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1290" viewBox="0 0 1000 430">
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#111}</style>
<rect x="0.0" y="0.0" width="1000.0" height="430.0" fill="#fff"/>
<text x="8.0" y="20.0" font-size="19.5" text-anchor="start" fill="#111" font-weight="700">空位游程：核酸全局比对 vs 蛋白全局比对</text>
<rect x="120.0" y="100.0" width="50.0" height="230.0" fill="#1f3f66"/>
<text x="145.0" y="94.0" font-size="14.3" text-anchor="middle" fill="#111" font-weight="700">53 段</text>
<text x="145.0" y="348.0" font-size="13.7" text-anchor="middle" fill="#111" font-weight="normal">核酸 query</text>
<text x="145.0" y="364.0" font-size="13.0" text-anchor="middle" fill="#6c7278" font-weight="normal">最长 46</text>
<rect x="300.0" y="178.1" width="50.0" height="151.9" fill="#466f87"/>
<text x="325.0" y="172.1" font-size="14.3" text-anchor="middle" fill="#111" font-weight="700">35 段</text>
<text x="325.0" y="348.0" font-size="13.7" text-anchor="middle" fill="#111" font-weight="normal">核酸 subject</text>
<text x="325.0" y="364.0" font-size="13.0" text-anchor="middle" fill="#6c7278" font-weight="normal">最长 32</text>
<rect x="480.0" y="312.6" width="50.0" height="17.4" fill="#6b8db8"/>
<text x="505.0" y="306.6" font-size="14.3" text-anchor="middle" fill="#111" font-weight="700">4 段</text>
<text x="505.0" y="348.0" font-size="13.7" text-anchor="middle" fill="#111" font-weight="normal">蛋白 直系</text>
<text x="505.0" y="364.0" font-size="13.0" text-anchor="middle" fill="#6c7278" font-weight="normal">最长 58</text>
<rect x="660.0" y="321.3" width="50.0" height="8.7" fill="#9db6d4"/>
<text x="685.0" y="315.3" font-size="14.3" text-anchor="middle" fill="#111" font-weight="700">2 段</text>
<text x="685.0" y="348.0" font-size="13.7" text-anchor="middle" fill="#111" font-weight="normal">蛋白 并系</text>
<text x="685.0" y="364.0" font-size="13.0" text-anchor="middle" fill="#6c7278" font-weight="normal">最长 58</text>
<line x1="120.0" y1="330.0" x2="800.0" y2="330.0" stroke="#333" stroke-width="0.9"/>
<text x="120.0" y="390.0" font-size="14.3" text-anchor="start" fill="#111" font-weight="normal">核酸全局比对：88 段空位，最长 46 bp；蛋白全局比对只有 4/2 段，最长 58 aa。</text>
<text x="120.0" y="410.0" font-size="14.3" text-anchor="start" fill="#111" font-weight="normal">蛋白的空位是集中的末端缺口，不是散布的小 indel。</text>
